[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fsoc-tracker"
version = "1.0.0"
description = "FSOC Virtual Camera Tracking PAT Simulator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "PyQt5>=5.15", "pyqtgraph>=0.12", "PyYAML>=6.0", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fsoc-tracker = "fsoc_tracker.main:main"

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
markers = [
    "headless: headless pipeline tests without display",
    "smoke: fast smoke test",
    "slow: longer preset sweeps"
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestUnknownMarkWarning"]
