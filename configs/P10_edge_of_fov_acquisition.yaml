# P10 -- Edge-of-FOV acquisition
# Purpose: Initial search, nonlinear pixel-to-angle conversion and acquisition near camera limits.
# Expected: acquisition <=2.0s, state LOCKED, false_lock 0
# Plan: straight 50px/s [30,40] start_visible false, camera pan -1.6 tilt 1.1, search expanding_spiral max 2s, gauss 2 poisson 0.05
# Shared defaults per Preset Plan.md: input fps 30 res 640x480, camera hfov 4 vfov 3 max_pan/tilt 5 update 30, beacon size 10 intensity 1.0, controller pid kp 1.0 kd 0.15 dead 2 reacq 1s, tracker imm_ekf gate 3 sigma pred 3 temp 10
world:
  width: 2000
  height: 2000
  background: 18
camera:
  type: monochrome
  resolution:
  - 640
  - 480
  fov_deg:
  - 4.0
  - 3.0
  fps: 30
  initial_position: user-defined
  initial_pan: -1.6
  initial_tilt: 1.1
  max_pan_speed: 5.0
  max_tilt_speed: 5.0
  update_interval_hz: 30
  jitter_px: 0
  video_centre_offset_x: 0.0
  video_centre_offset_y: 0.0
target:
  type: beacon_spot
  count: 1
  shape: square
  size: 10
  initial_pos:
  - 30
  - 40
  initial_mode: user-defined
  trajectory: straight
  speed_px_per_frame: 1.7
  angle_deg: 30.0
  radius: 180.0
  intensity: 255
  custom_polygon: null
  custom_trajectory_file: null
  custom_trajectory_path: null
platform:
  type: none
  speed_px_per_frame: 0
  amplitude: 0
noise:
  gaussian_enabled: true
  gaussian_std: 2.0
  salt_pepper_enabled: false
  salt_pepper_prob: 0
  poisson: true
atmosphere:
  type: clear
  strength: 0
environment:
  gradient_enabled: false
  gradient_type: linear
  gradient_top: 22
  gradient_bottom: 38
  gradient_angle: 90
  stars_enabled: false
  stars_density: 0.0007
  stars_brightness: 185
  stars_min_mag: 90
  stars_max_mag: 255
  stars_twinkle: false
  stars_seed: 1337
  vignetting_enabled: false
  vignetting_strength: 0.42
  vignetting_radius: 0.72
  vignetting_falloff: 2.0
  vignetting_center_x: 0.5
  vignetting_center_y: 0.5
  brightness_gain: 1.0
  brightness_offset: 0
detector:
  threshold_k: 3.0
  min_area: 8
  max_area: 900
  blur_ksize: 3
  adaptive_block: 51
  adaptive_C: -5
tracker:
  process_noise: 0.8
  meas_noise: 4.0
  gate_sigma: 3.0
  lost_timeout_frames: 15
  reacq_timeout_frames: 30
controller:
  kp_pan: 1.0
  kp_tilt: 1.0
  ki: 0.0
  kd: 0.15
  deadzone_px: 2.0
  integral_limit: 8.0
  feedforward_gain: 0.0
experiment:
  duration_s: 30.0
  seed: 51
  input_mode: SYNTHETIC
  video_path: ''
preset_meta:
  preset: P10_edge_of_fov_acquisition
  purpose: Edge-of-FOV acquisition
  expected:
    acquisition_time_s: <=2.0
    state: LOCKED
    false_lock_count: 0
  plan_extra:
    start_visible: false
    search:
      mode: expanding_spiral
      max_duration_s: 2.0
    poisson_strength: 0.05
search:
  mode: expanding_spiral
  max_duration_s: 2.0
