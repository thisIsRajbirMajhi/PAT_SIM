# P08 -- Camera jitter
# Purpose: Separation of image disturbance from target motion; estimator must not overreact to frame-to-frame jitter.
# Expected: state LOCKED, rmse <=15px, command_saturation <10%
# Plan: straight 80px/s, gauss 4 poisson 0.08 jitter 20 bounded_random
# Shared defaults per Preset Plan.md: input fps 30 res 640x480, camera hfov 4 vfov 3 max_pan/tilt 5 update 30, beacon size 10 intensity 1.0, controller pid kp 1.0 kd 0.15 dead 2 reacq 1s, tracker imm_ekf gate 3 sigma pred 3 temp 10
world:
  width: 2000
  height: 2000
  background: 18
camera:
  type: monochrome
  resolution:
  - 640
  - 480
  fov_deg:
  - 4.0
  - 3.0
  fps: 30
  initial_position: centre
  initial_pan: 0.0
  initial_tilt: 0.0
  max_pan_speed: 5.0
  max_tilt_speed: 5.0
  update_interval_hz: 30
  jitter_px: 20.0
  video_centre_offset_x: 0.0
  video_centre_offset_y: 0.0
target:
  type: beacon_spot
  count: 1
  shape: square
  size: 10
  initial_pos: null
  initial_mode: random
  trajectory: straight
  speed_px_per_frame: 2.7
  angle_deg: 30.0
  radius: 180.0
  intensity: 255
  custom_polygon: null
  custom_trajectory_file: null
  custom_trajectory_path: null
platform:
