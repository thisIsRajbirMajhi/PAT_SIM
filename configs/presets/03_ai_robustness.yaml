# Curated GUI preset: AI identification under moderate combined disturbances.
preset_meta:
  preset: ai_robustness
  display_name: AI — Robustness
  order: 30
  system: "ai"
  ai_mode: "ON"
  purpose: Test primary/decoy identification with noise, haze, jitter, platform motion, and faster decoys.
  expected:
    targets: "1 primary + 2 decoys"
    identity: "Reject decoys; no false primary lock"

experiment:
  seed: 46
  duration_s: 30.0
  input_mode: SYNTHETIC
  video_path: ""

target:
  count: 3
  shape: square
  size: 10
  initial_mode: user-defined
  initial_pos: [1000, 1000]
  trajectory: figure_eight
  speed_px_per_frame: 2.4
  angle_deg: 0.0
  radius: 150.0
  intensity: 255

platform:
  type: linear
  speed_px_per_frame: 1.5
  amplitude: 8.0

camera:
  jitter_px: 2.0

noise:
  gaussian_enabled: true
  gaussian_std: 5.0
  salt_pepper_enabled: true
  salt_pepper_prob: 0.01
  poisson: true

atmosphere:
  type: haze
  strength: 0.15

ai:
  enabled: true
  fallback_on_failure: true
  candidate_model_path: ""
  identity_model_path: ""
  inference_timeout_ms: 40
  thresholds:
    primary_threshold: 0.85
    decoy_threshold: 0.85
    confirmation_frames: 5
    unknown_low: 0.45
    unknown_high: 0.85
  signatures:
    enabled: true
    blink_enabled: true
    blink_pattern: "10110010"
    modulation_freq_hz: 12.0
    freq_tolerance: 0.05
    expected_shape: square
    size_range_px: [5, 20]
    persistence_frames: 5

primary_target:
  shape: square
  size_px: 10
  brightness_range: [180, 255]
  optical_signature:
    enabled: true
    blink_pattern: "10110010"
    modulation_freq_hz: 12.0
    freq_tolerance: 0.05

decoys:
  enabled: true
  count: 2
  initial_positions:
    - [940, 970]
    - [1060, 1030]
  profiles:
    - type: reflection
      brightness_range: [210, 255]
      blink_pattern: "11100011"
      freq_hz: 8.0
    - type: false_beacon
      brightness_range: [200, 255]
      blink_pattern: "10101010"
      freq_hz: 12.0
