# Curated GUI preset: AI identification with one primary and two decoys.
preset_meta:
  preset: ai_primary_decoys
  display_name: AI — Primary + Decoys
  order: 10
  system: "ai"
  ai_mode: "ON"
  purpose: Demonstrate multi-candidate tracking, coded-signature identity, and decoy rejection.
  expected:
    targets: "1 primary + 2 decoys"
    identity: "PRIMARY_CONFIRMED after 5 consistent observations"

experiment:
  seed: 42
  duration_s: 30.0
  input_mode: SYNTHETIC
  video_path: ""

target:
  count: 3
  shape: square
  size: 10
  initial_mode: user-defined
  initial_pos: [1000, 1000]
  trajectory: straight
  speed_px_per_frame: 1.5
  angle_deg: 0.0
  radius: 160.0
  intensity: 255

platform:
  type: none
  speed_px_per_frame: 0.0

noise:
  gaussian_enabled: false
  gaussian_std: 0.0
  salt_pepper_enabled: false
  salt_pepper_prob: 0.0
  poisson: false

atmosphere:
  type: clear
  strength: 0.0

ai:
  enabled: true
  fallback_on_failure: true
  candidate_model_path: ""
  identity_model_path: ""
  thresholds:
    primary_threshold: 0.85
    decoy_threshold: 0.85
    confirmation_frames: 5
    unknown_low: 0.45
    unknown_high: 0.85
  signatures:
    enabled: true
    blink_enabled: true
    blink_pattern: "10110010"
    modulation_freq_hz: 12.0
    freq_tolerance: 0.05
    expected_shape: square
    size_range_px: [5, 20]
    persistence_frames: 5

primary_target:
  shape: square
  size_px: 10
  brightness_range: [180, 255]
  optical_signature:
    enabled: true
    blink_pattern: "10110010"
    modulation_freq_hz: 12.0
    freq_tolerance: 0.05

decoys:
  enabled: true
  count: 2
  initial_positions:
    - [960, 980]
    - [1040, 1020]
  profiles:
    - type: reflection
      brightness_range: [210, 255]
      blink_pattern: "11100011"
      freq_hz: 8.0
    - type: false_beacon
      brightness_range: [200, 255]
      blink_pattern: "10101010"
      freq_hz: 12.0
