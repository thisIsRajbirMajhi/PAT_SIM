# P09 -- Linear platform motion
# Purpose: Platform motion modelled separately from camera actuation; controller compensates without ground-truth leakage.
# Expected: state LOCKED, rmse <=15px, platform_motion_logged true, ground_truth_used_by_tracker false
# Plan: straight 70px/s, gauss 3 poisson 0.05, platform linear velocity [12,-8] max 500
# Shared defaults per Preset Plan.md: input fps 30 res 640x480, camera hfov 4 vfov 3 max_pan/tilt 5 update 30, beacon size 10 intensity 1.0, controller pid kp 1.0 kd 0.15 dead 2 reacq 1s, tracker imm_ekf gate 3 sigma pred 3 temp 10
world:
  width: 2000
  height: 2000
  background: 18
camera:
  type: monochrome
  resolution:
  - 640
  - 480
  fov_deg:
  - 4.0
  - 3.0
  fps: 30
  initial_position: centre
  initial_pan: 0.0
  initial_tilt: 0.0
  max_pan_speed: 5.0
  max_tilt_speed: 5.0
  update_interval_hz: 30
  jitter_px: 0
  video_centre_offset_x: 0.0
  video_centre_offset_y: 0.0
target:
  type: beacon_spot
  count: 1
  shape: square
  size: 10
  initial_pos: null
  initial_mode: random
  trajectory: straight
  speed_px_per_frame: 2.3
  angle_deg: 30.0
  radius: 180.0
  intensity: 255
  custom_polygon: null
  custom_trajectory_file: null
  custom_trajectory_path: null
platform:
  type: linear
  speed_px_per_frame: 14.0
  amplitude: 0.0
  velocity_px_frame:
  - 12
  - -8
  max_displacement_px: 500
noise:
  gaussian_enabled: true
  gaussian_std: 3.0
  salt_pepper_enabled: false
  salt_pepper_prob: 0
  poisson: true
atmosphere:
  type: clear
  strength: 0
environment:
  gradient_enabled: false
  gradient_type: linear
  gradient_top: 22
  gradient_bottom: 38
  gradient_angle: 90
  stars_enabled: false
  stars_density: 0.0007
  stars_brightness: 185
  stars_min_mag: 90
  stars_max_mag: 255
  stars_twinkle: false
  stars_seed: 1337
  vignetting_enabled: false
  vignetting_strength: 0.42
  vignetting_radius: 0.72
  vignetting_falloff: 2.0
  vignetting_center_x: 0.5
  vignetting_center_y: 0.5
  brightness_gain: 1.0
  brightness_offset: 0
detector:
  threshold_k: 3.0
  min_area: 8
  max_area: 900
  blur_ksize: 3
  adaptive_block: 51
  adaptive_C: -5
tracker:
  process_noise: 0.8
  meas_noise: 4.0
  gate_sigma: 3.0
  lost_timeout_frames: 15
  reacq_timeout_frames: 30
controller:
  kp_pan: 1.0
  kp_tilt: 1.0
  ki: 0.0
  kd: 0.15
  deadzone_px: 2.0
  integral_limit: 8.0
  feedforward_gain: 0.0
experiment:
  duration_s: 30.0
  seed: 50
  input_mode: SYNTHETIC
  video_path: ''
preset_meta:
  preset: P09_linear_platform_motion
  purpose: Linear platform motion
  expected:
    state: LOCKED
    rmse_px: <=15
    platform_motion_logged: true
  plan_extra:
    velocity_px_frame:
    - 12
    - -8
    max_displacement_px: 500
