# P11 -- Forced loss and re-acquisition
# Purpose: State transitions, prediction timeout, PID integral reset, search control and recovery timing.
# Expected: loss_event_count 1, reacq <=1.0s, pid_integral_reset true
# Plan: figure_eight width 280 height 180 period 10, visibility 0-5 visible 5-5.5 hidden 5.5-12 visible, gauss 5 poisson 0.12 spp 0.003 jitter 4, tracker pred 3 temp 10, search local_then_spiral timeout 1.0
# Shared defaults per Preset Plan.md: input fps 30 res 640x480, camera hfov 4 vfov 3 max_pan/tilt 5 update 30, beacon size 10 intensity 1.0, controller pid kp 1.0 kd 0.15 dead 2 reacq 1s, tracker imm_ekf gate 3 sigma pred 3 temp 10
world:
  width: 2000
  height: 2000
  background: 18
camera:
  type: monochrome
  resolution:
  - 640
  - 480
  fov_deg:
  - 4.0
  - 3.0
  fps: 30
  initial_position: centre
  initial_pan: 0.0
  initial_tilt: 0.0
  max_pan_speed: 5.0
  max_tilt_speed: 5.0
  update_interval_hz: 30
  jitter_px: 4.0
  video_centre_offset_x: 0.0
  video_centre_offset_y: 0.0
target:
  type: beacon_spot
  count: 1
  shape: square
  size: 10
  initial_pos: null
  initial_mode: random
  trajectory: figure_eight
  speed_px_per_frame: 2.5
  angle_deg: 30.0
  radius: 140
  intensity: 255
  custom_polygon: null
  custom_trajectory_file: null
  custom_trajectory_path: null
  visibility_schedule:
  - - 0
    - 5
    - visible
  - - 5
    - 5.5
    - hidden
  - - 5.5
    - 12
    - visible
platform:
  type: none
  speed_px_per_frame: 0
  amplitude: 0
noise:
  gaussian_enabled: true
  gaussian_std: 5.0
  salt_pepper_enabled: true
  salt_pepper_prob: 0.003
  poisson: true
atmosphere:
  type: clear
  strength: 0
environment:
  gradient_enabled: false
  gradient_type: linear
  gradient_top: 22
  gradient_bottom: 38
  gradient_angle: 90
  stars_enabled: false
  stars_density: 0.0007
  stars_brightness: 185
  stars_min_mag: 90
  stars_max_mag: 255
  stars_twinkle: false
  stars_seed: 1337
  vignetting_enabled: false
  vignetting_strength: 0.42
  vignetting_radius: 0.72
  vignetting_falloff: 2.0
  vignetting_center_x: 0.5
  vignetting_center_y: 0.5
  brightness_gain: 1.0
  brightness_offset: 0
